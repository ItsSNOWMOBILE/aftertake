name: Feature request
description: A workflow Aftertake should support or make easier.
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: What you want to make
      description: Describe the shot, edit or result, not only the feature.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What you do today
      description: The steps or tools you use now, and where they fall short.
